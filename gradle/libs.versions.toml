[versions]
exposed = "1.2.0"
ktor = "3.4.3"
hoplite = "2.9.0"
arrow = "2.2.2.1"
emottak-xsd = "0.0.12"
kotlin-kafka = "0.4.1"
logback = "1.5.32"
logstash = "9.0"
prometheus = "1.16.5"
token-validation-ktor = "6.0.7"
postgresql = "42.7.11"
hikari = "7.0.2"
flyway = "12.6.1"
ibm-mq = "9.4.5.1"

[libraries]
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }

server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }
server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
server-swagger = { module = "io.ktor:ktor-server-swagger", version.ref = "ktor" }
micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }

kotlin-kafka = { module = "io.github.nomisrev:kotlin-kafka", version.ref = "kotlin-kafka" }

micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "prometheus" }

hoplite-core = { module = "com.sksamuel.hoplite:hoplite-core", version.ref = "hoplite" }
hoplite-hocon = { module = "com.sksamuel.hoplite:hoplite-hocon", version.ref = "hoplite" }

arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines", version.ref = "arrow" }
arrow-functions = { module = "io.arrow-kt:arrow-functions", version.ref = "arrow" }

arrow-suspendapp = { module = "io.arrow-kt:suspendapp", version.ref = "arrow" }
arrow-suspendapp-ktor = { module = "io.arrow-kt:suspendapp-ktor", version.ref = "arrow" }

emottak-payload-xsd = { module = "no.nav.emottak:emottak-payload-xsd", version.ref = "emottak-xsd" }

logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }

token-validation-ktor-v3 = { module = "no.nav.security:token-validation-ktor-v3", version.ref = "token-validation-ktor" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

ibm-mq = { module = "com.ibm.mq:com.ibm.mq.allclient", version.ref = "ibm-mq" }

[bundles]
suspendapp = ["arrow-suspendapp", "arrow-suspendapp-ktor"]
exposed = ["exposed-core", "exposed-dao", "exposed-jdbc", "exposed-time", "exposed-json"]
ktor = ["server-content-negotiation", "client-content-negotiation", "serialization-json", "micrometer", "server-core", "server-netty", "server-config-yaml"]
hoplite = ["hoplite-core", "hoplite-hocon"]
arrow = ["arrow-core", "arrow-fx-coroutines", "arrow-functions"]
