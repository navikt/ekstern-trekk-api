name: Deploy Ekstern trekk-api
run-name: Deploy ${{ inputs.branch || github.ref_name }} to ${{ inputs.environment || 'dev and prod' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy
        required: true
        default: main
        type: string
      environment:
        description: Environment to deploy to
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and push Docker container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-ekstern-trekk-api.outputs.image }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch || github.sha }}
      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: Europe/Oslo
      - name: Cache gradle wrapper
        uses: actions/cache@v6.1.0
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Cache Gradle packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-cache-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-cache-
      - name: Build and tests
        run: ./gradlew test build
        env:
          ORG_GRADLE_PROJECT_githubUser: x-access-token
          ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker build and push ekstern-trekk-api
        uses: nais/docker-build-push@v0
        id: docker-ekstern-trekk-api
        with:
          team: team-emottak
          salsa: true
          tag: ${{ steps.source.outputs.sha }}
          dockerfile: Dockerfile
          image_suffix: ekstern-trekk-api
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || '["dev","prod"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build-and-push.outputs.sha }}
      - name: Deploy ekstern-trekk-api
        uses: nais/deploy/actions/deploy@v3
        env:
          CLUSTER: ${{ matrix.environment }}-gcp
          RESOURCE: .nais/ekstern-trekk-api-${{ matrix.environment }}.yaml
          VAR: image=${{ needs.build-and-push.outputs.image }}
